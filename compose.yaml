services:
  postgres:
    # pgvector 0.8.7 on PostgreSQL 17, the versions Azure Database for PostgreSQL offers.
    image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Over TCP: during first-start initialisation the server listens on the socket only.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  edge:
    # Local runs and the live tests only: docker compose --profile live up -d --wait
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    profiles: ["live"]
    environment:
      - ORIGIN_HEADER_SECRET
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./infra/edge:/etc/caddy:ro
