name: ci

on:
  push:
    branches: [main]
    tags: ["step/**", "rung/**"]
  pull_request:

permissions:
  contents: read

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: docker compose up -d --wait
      - run: uv run pytest
      - run: uv run pip-audit

  terraform:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        root: [infra/bootstrap, infra/foundry]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: secret scan
        # gitleaks v8.30.1, the digest of the image's multi-platform index
        run: >
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --exit-code 1 .
      - name: banned-phrase scan
        env:
          BANNED_PHRASES: ${{ secrets.BANNED_PHRASES }}
        run: |
          test -n "$BANNED_PHRASES" || { echo "BANNED_PHRASES secret is empty"; exit 1; }
          printf '%s\n' "$BANNED_PHRASES" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/phrases"
          # corpus/ holds vendored regulation text and is left out of this scan; the secret scan above still reads it.
          hits=$({ git grep -I -i -F -f "$RUNNER_TEMP/phrases" -- . ':(exclude)corpus' || true
                   git log --all --format='%H%n%B' | grep -I -i -F -f "$RUNNER_TEMP/phrases" || true
                   git log --all -p --format= -- . ':(exclude)corpus' | grep -I -i -F -f "$RUNNER_TEMP/phrases" || true
                   git tag -l --format='%(refname) %(contents)' | grep -i -F -f "$RUNNER_TEMP/phrases" || true
                 } | wc -l)
          [ "$hits" -eq 0 ] || { echo "$hits banned-phrase hit(s)"; exit 1; }
