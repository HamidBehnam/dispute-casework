name: ci

on:
  push:
    branches: [main]
    tags: ["step/**", "rung/**"]
  pull_request:

permissions:
  contents: read

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: docker compose up -d --wait
      - run: uv run pytest
      - run: uv run pip-audit

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run build
        env:
          VITE_TENANT_ID: ci-build-check
          VITE_WEB_CLIENT_ID: ci-build-check
          VITE_API_CLIENT_ID: ci-build-check

  terraform:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        root: [infra/bootstrap, infra/foundry, infra/postgres, infra/app, infra/identity]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: secret scan
        # gitleaks v8.30.1, the digest of the image's multi-platform index
        run: >
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --exit-code 1 --log-opts="--full-history --all -m" .
