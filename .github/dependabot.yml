version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns:
          - mypy
          - pip-audit
          - pytest
          - ruff
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/foundry
    schedule:
      interval: weekly
