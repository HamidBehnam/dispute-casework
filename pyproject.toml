[project]
name = "dispute-casework"
version = "0.1.0"
description = "Casework service for a fictional bank's dispute-operations team."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "azure-identity>=1.25.3",
    "azure-postgresql-auth[psycopg3]>=1.1.0",
    "beautifulsoup4>=4.15.0",
    "cohere>=7.2.0",
    "httpx>=0.28.1",
    "langchain-azure-ai>=1.2.10",
    "langchain-core>=1.6.6",
    "langchain-postgres==0.0.19",
    "langgraph-checkpoint-postgres==3.1.3",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
]

[dependency-groups]
dev = [
    "deepeval==4.2.8",
    "ir-measures==0.4.3",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-recording==0.13.4",
    "ruff==0.16.9",
    "scipy==1.18.1",
    "vcrpy==8.3.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.21"

[tool.alembic]
script_location = "%(here)s/migrations"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "--block-network -p no:deepeval -p no:asyncio -p no:repeat -p no:rerunfailures -p no:xdist -p no:xdist.looponfail"

[tool.mypy]
strict = true
files = ["src", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_azure_ai.*", "scipy.*", "vcr.*"]
ignore_missing_imports = true
