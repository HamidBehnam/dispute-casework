[project]
name = "dispute-casework"
version = "0.1.0"
description = "Casework service for a fictional bank's dispute-operations team."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "azure-core>=1.41.0",
    "azure-identity>=1.25.3",
    "cohere>=7.2.0",
    "httpx>=0.28.1",
    "langchain-azure-ai>=1.2.10",
    "langchain-core>=1.6.6",
    "langchain-postgres==0.0.18",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-recording==0.13.4",
    "ruff==0.16.9",
    "vcrpy==8.3.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.21"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--block-network"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["langchain_azure_ai.*"]
ignore_missing_imports = true
