[project]
name = "dispute-casework"
version = "0.1.0"
description = "Casework service for a fictional bank's dispute-operations team."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.25.3",
    "cohere>=7.2.0",
    "langchain>=1.4.3",
    "langchain-azure-ai>=1.2.10",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.21"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["langchain_azure_ai.*"]
ignore_missing_imports = true
